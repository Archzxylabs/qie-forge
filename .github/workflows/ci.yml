name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install pinned npm
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: 1.8.1

      - name: Install pinned solc and verify its checksum
        run: |
          set -euo pipefail
          solc_path="$RUNNER_TEMP/solc-0.8.37"
          mkdir -p "$(dirname "$solc_path")"
          url="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.37+commit.f401782d"
          curl --fail --silent --show-error --location "$url" --output "$solc_path"
          echo "5de843c2c93563cc66425c99a4fb13fdbf32b4c4ae07469480faaf126e14404a  $solc_path" | sha256sum --check
          chmod +x "$solc_path"
          "$solc_path" --version
          echo "QIE_FORGE_SOLC=$solc_path" >> "$GITHUB_ENV"

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify native test prerequisites
        run: |
          set -euo pipefail
          test -x "$(git --exec-path)/git-http-backend"
          forge --version | tee "$RUNNER_TEMP/forge-version.txt"
          grep -F 'Version: 1.8.1' "$RUNNER_TEMP/forge-version.txt"
          "$QIE_FORGE_SOLC" --version

      - name: Prove the example asset is current
        run: npm run example:prepare:check

      # Build is intentionally retained as a first-class gate. It is followed
      # by build:check so the same checkout proves both reproducible generation
      # and committed publication parity.
      - name: Build the deterministic skill release
        run: npm run build

      - name: Check the supported environment
        run: npm run doctor

      - name: Validate knowledge and skills
        run: npm run validate

      - name: Prove generated bundles are current
        run: npm run build:check

      - name: Verify generated documentation
        run: npm run docs:check

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Type-check the example and canonical controller
        run: npm run typecheck

      - name: Run the repository test suite
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage

      - name: Run installation fixture suite
        run: npm run test:install

      - name: Install the browser required by the deterministic checks
        run: npx playwright install --with-deps --no-shell chromium

      - name: Build the counter example from the canonical contract source
        run: npm run example:build

      - name: Run deterministic browser checks
        run: npm run test:browser

      - name: Verify the checks left the checkout clean
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::Tracked files changed during verification."
            git status --porcelain
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Untracked or modified files appeared during verification."
            git status --porcelain
            exit 1
          fi
          echo "Working tree is clean."

      - name: Upload browser and npm failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-artifacts
          path: |
            examples/counter-dapp/playwright-report
            examples/counter-dapp/test-results
            /home/runner/.npm/_logs
          if-no-files-found: ignore
          retention-days: 7
