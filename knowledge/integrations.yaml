- entity_id: qie-lending-protocol
  entity_type: protocol
  display_name: QIE Lending Protocol
  network_scope:
    - qie-mainnet
  version_scope: commit 21d2ef2d5c4e9ac82f7e5d72e628341bd0b15262; package 1.0.0
  description: Compound-style lending interface described by the official QIE Lending SDK with comptroller and cToken market roles.
  interfaces:
    - interface_id: qie-lending-ctoken
      kind: ABI
      name: mint(uint256), borrow(uint256), repayBorrow(uint256), redeemUnderlying(uint256)
      status: DOCUMENTED
      source_ids:
        - S29
      description: cToken function fragments shipped in the pinned SDK ABI.
      execution_allowed: false
    - interface_id: qie-lending-comptroller
      kind: ABI
      name: enterMarkets(address[]) and getAccountLiquidity(address)
      status: DOCUMENTED
      source_ids:
        - S29
      description: Comptroller fragments used for borrow preparation and portfolio health display.
      execution_allowed: false
  operations:
    - operation_id: lending-supply
      name: Supply an underlying asset
      action: write
      interface_id: qie-lending-ctoken
      status: DOCUMENTED
      inputs:
        - Market key and raw BigInt underlying amount
        - Underlying token and cToken candidate identities
        - Signer with allowance and balance
      outputs:
        - cToken mint transaction object
      source_ids:
        - S29
      limitations:
        - SDK calls approveIfNeeded and then cToken.mint without a configured receipt wait in supply.js.
        - Market and token addresses are published candidates, not identity-approved deployments.
        - Amount decimals are caller-configured in config.js and are not read dynamically.
      execution_allowed: false
    - operation_id: lending-borrow
      name: Borrow a market asset
      action: write
      interface_id: qie-lending-comptroller
      status: DOCUMENTED
      inputs:
        - Market key and raw BigInt borrow amount
        - Signer, comptroller candidate and cToken candidate
      outputs:
        - enterMarkets receipt followed by cToken.borrow transaction object
      source_ids:
        - S29
      limitations:
        - The SDK enters the market as a state-changing side effect before borrow simulation.
        - borrow.js does not guard an unknown market before dereferencing its cToken.
        - Liquidity, collateral factors, oracle values, caps and liquidation parameters are not read by the SDK.
      execution_allowed: false
    - operation_id: lending-repay
      name: Repay a loan
      action: write
      interface_id: qie-lending-ctoken
      status: DOCUMENTED
      inputs:
        - Market key and raw BigInt amount
        - Underlying token approval and signer
      outputs:
        - repayBorrow transaction object
      source_ids:
        - S29
      limitations:
        - repay.js approves every time and does not wait for or validate a receipt after repayBorrow.
        - No max-repay or balance normalization is implemented.
      execution_allowed: false
    - operation_id: lending-withdraw
      name: Withdraw supplied underlying
      action: write
      interface_id: qie-lending-ctoken
      status: DOCUMENTED
      inputs:
        - Market key and raw BigInt underlying amount
        - Signer and cToken candidate
      outputs:
        - redeemUnderlying transaction object
      source_ids:
        - S29
      limitations:
        - No local simulation, allowance check or receipt wait is performed by withdraw.js.
        - Cash and liquidity constraints are not checked before the write.
      execution_allowed: false
    - operation_id: lending-read-portfolio
      name: Read user portfolio
      action: read
      interface_id: qie-lending-ctoken
      status: DOCUMENTED
      inputs:
        - Read-only provider, user address and configured market candidates
      outputs:
        - supplied and borrowed raw amounts plus a numeric health value
      source_ids:
        - S29
      limitations:
        - balanceOfUnderlying is marked nonpayable in the shipped ABI but called with staticCall.
        - Health divides a raw liquidity value by 1e18 without documenting the protocol's exact price/scale semantics.
        - A nonzero shortfall is reduced to health 0 and comptroller error codes are not surfaced.
      execution_allowed: false
    - operation_id: lending-read-totals
      name: Read protocol totals
      action: read
      interface_id: qie-lending-ctoken
      status: DOCUMENTED
      inputs:
        - Read-only provider and configured market candidates
      outputs:
        - Decimal-string totalSupply and totalBorrow sums across configured markets
      source_ids:
        - S29
      limitations:
        - Totals sum cToken totalSupply values across markets with different decimals and do not normalize to a common denomination.
        - No market metadata freshness or deployment identity check is included.
      execution_allowed: false
  source_ids:
    - S29
    - S30
  reviewed_at: 2026-10-24T20:00:51Z
  evidence_type: OFFICIAL_DOC
  status: DOCUMENTED
  known_limitations:
    - Published addresses and ABI fragments are discovery evidence, not proof of current deployed compatibility.
    - Borrow and collateral safety requires live market metadata and oracle evidence not supplied by the SDK.
    - No npm registry publication was found; the README instructs GitHub installation.
  unresolved_questions:
    - Which deployment, implementation and proxy addresses are current on QIE Mainnet?
    - What are the live collateral factors, liquidation thresholds, caps, rates and oracle sources?
    - Does the deployed ABI match the shipped minimal JSON fragments?
  conflict_ids: []
  related_entity_ids:
    - qie-lending-sdk
    - qusdc-protocol
    - qie-oracle
  integration_recipe_ids:
    - lending-read
    - erc20-asset
    - ecosystem-address
  execution_allowed: false

