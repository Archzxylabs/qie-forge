- entity_id: qusdc-protocol
  entity_type: protocol
  display_name: QUSDC
  network_scope:
    - qie-mainnet
    - general
  version_scope: null
  description: Issuer-documented QIE receipt-token protocol whose detailed flow uses WUSDC as the QIE-side backing asset and QUSDC as the receipt asset.
  interfaces:
    - interface_id: qusdc-vault-abi
      kind: ABI
      name: depositAndMint(uint256) / burnAndWithdraw(uint256)
      status: DOCUMENTED
      source_ids:
        - S28
      description: Minimal vault ABI fragment used by the official JavaScript SDK.
      execution_allowed: false
    - interface_id: qusdc-erc20-input
      kind: ABI
      name: ERC-20 allowance, approve and decimals
      status: DOCUMENTED
      source_ids:
        - S28
      description: ERC-20 methods the SDK uses to prepare WUSDC allowance and parse human-readable amounts.
      execution_allowed: false
  operations:
    - operation_id: qusdc-mint
      name: Mint QUSDC from WUSDC
      action: write
      interface_id: qusdc-vault-abi
      status: DOCUMENTED
      inputs:
        - Human-readable WUSDC amount or raw integer amount
        - Approved vault and WUSDC identities
        - Signer-controlled account with sufficient WUSDC and gas
      outputs:
        - depositAndMint(uint256) transaction and waited receipt
        - QUSDC balance change only after application-specific verification
      source_ids:
        - S23
        - S28
      limitations:
        - SDK requires separate vaultAddress and wusdcAddress inputs.
        - Production vault, WUSDC and QUSDC identities are not issuer-authenticated in this release.
        - A receipt is not proof of minting, reserve backing or economic value.
      execution_allowed: false
    - operation_id: qusdc-redeem
      name: Redeem QUSDC to WUSDC
      action: write
      interface_id: qusdc-vault-abi
      status: DOCUMENTED
      inputs:
        - Human-readable amount or raw integer amount in the SDK's WUSDC-derived scale
        - QUSDC balance and the reviewed vault identity
        - Signer-controlled account with sufficient QUSDC and gas
      outputs:
        - burnAndWithdraw(uint256) transaction and waited receipt
        - WUSDC balance change only after application-specific verification
      source_ids:
        - S23
        - S28
      limitations:
        - The SDK uses the WUSDC decimals lookup for both mint and burn parsing; QUSDC decimal equality is not independently established.
        - Redemption availability, fees, pause controls and reserve liquidity are not verified on a deployment.
        - Bridging WUSDC back to Ethereum is a separate cross-chain operation.
      execution_allowed: false
    - operation_id: qusdc-read-decimals
      name: Read WUSDC decimals
      action: read
      interface_id: qusdc-erc20-input
      status: DOCUMENTED
      inputs:
        - WUSDC candidate address and read-only provider
      outputs:
        - uint8 decimals value returned by the token contract
      source_ids:
        - S28
      limitations:
        - A contract-returned decimals value is observation metadata, not proof of token identity or economic denomination.
        - Do not default to 6 or 18 without the selected token's read result.
      execution_allowed: false
  source_ids:
    - S22
    - S23
    - S24
    - S25
    - S26
    - S28
  reviewed_at: 2026-10-24T20:00:51Z
  evidence_type: OFFICIAL_DOC
  status: DOCUMENTED
  known_limitations:
    - Issuer documentation uses both generic USDC language and the more specific WUSDC implementation flow.
    - The official SDK contains no deployment address and no reserve-proof or upgrade-authority inspection.
    - 1:1 receipt semantics are issuer-documented claims, not an independently verified market-price guarantee.
  unresolved_questions:
    - Which exact QIE contracts are the current production QUSDC token, WUSDC token and vault on each network?
    - Are minting, redemption, pause, fee and upgrade controls present in the deployed bytecode?
    - What independent reserve or supply reconciliation evidence is currently published?
  conflict_ids: []
  related_entity_ids:
    - qusdc-sdk
    - qie-lending-protocol
  integration_recipe_ids:
    - qusdc-escrow
    - erc20-asset
    - ecosystem-address
  execution_allowed: false

