  version_scope: commit 0877597f8bd51f7c21bb04e70009d3e9cab86944; package 1.0.0
  description: Official GitHub JavaScript SDK exposing an ESM QUSDCSdk class built on ethers v6.
  interfaces:
    - interface_id: qusdc-sdk-class
      kind: SDK
      name: QUSDCSdk({ signer, vaultAddress, wusdcAddress, confirmations })
      status: DOCUMENTED
      source_ids:
        - S27
        - S28
      description: Constructor accepts a signer, separate vault and WUSDC addresses, and an optional confirmation count.
      execution_allowed: false
  operations:
    - operation_id: qusdc-sdk-mint
      name: sdk.mint(amount)
      action: write
      interface_id: qusdc-sdk-class
      status: DOCUMENTED
      inputs:
        - string, number or bigint amount
        - Signer and separately reviewed vaultAddress and wusdcAddress
      outputs:
        - ethers transaction receipt after the configured confirmations
      source_ids:
        - S27
        - S28
      limitations:
        - _parseAmount uses Number(amount) for the positive check, so very large numeric inputs require caller-side validation.
        - BigInt inputs are treated as raw units and skip decimal parsing.
        - Exact approval and estimateGas are implemented in source, but token behavior and deployment identity remain unverified.
      execution_allowed: false
    - operation_id: qusdc-sdk-burn
      name: sdk.burn(amount)
      action: write
      interface_id: qusdc-sdk-class
      status: DOCUMENTED
      inputs:
        - string, number or bigint amount
        - Signer with QUSDC balance and separately reviewed vault identity
      outputs:
        - ethers transaction receipt after the configured confirmations
      source_ids:
        - S27
        - S28
      limitations:
        - SDK does not construct or validate a QUSDC token contract; it calls the configured vault only.
        - Returned receipt does not prove WUSDC delivery or redemption success.
      execution_allowed: false
  source_ids:
    - S27
