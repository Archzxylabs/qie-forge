- conflict_id: qusdc-backing-asset-naming
  subject: QUSDC backing asset terminology
  summary: QUSDC product pages often say USDC generically, while the detailed flow and SDK use WUSDC as the QIE-side input and redemption asset.
  source_ids:
    - S22
    - S23
    - S26
    - S28
  state: OPEN
  resolution: Treat WUSDC as the implementation-level input/output required by the reviewed SDK; do not equate WUSDC with native Circle USDC or claim reserve quality beyond issuer documentation.
  reviewed_at: 2026-10-24T20:00:51Z

- conflict_id: qusdc-candidate-address-role
  subject: QUSDC address role in the lending SDK
  summary: The lending SDK publishes 0x3F43... as the QUSDC market underlying, while the QUSDC SDK requires separate vaultAddress and wusdcAddress constructor inputs and publishes no deployment address.
  source_ids:
    - S28
    - S29
    - S30
  state: OPEN
  resolution: Retain the address as a lending configuration candidate only; do not label it as the QUSDC token, WUSDC token or vault without issuer and ABI identity evidence.
  reviewed_at: 2026-10-24T20:00:51Z

- conflict_id: qie-rpc-document-order
  subject: QIE mainnet RPC list labels
  summary: The official network page labels RPC3 as rpc5mainnet and RPC5 as rpc3mainnet, so list position and hostname suffix are not interchangeable evidence.
  source_ids:
    - S03
    - S10
    - S15
  state: OPEN
  resolution: Keep rpc1mainnet.qie.digital as the selected canonical endpoint and record the remaining documented endpoints as alternatives without assigning semantic rank from the page labels.
  reviewed_at: 2026-10-24T20:00:51Z

- conflict_id: qie-oracle-address-identity
  subject: Oracle address and interface identity
  summary: Official pages publish asset-to-address mappings and AggregatorV3 examples, but no reviewed chain observation or issuer-to-bytecode correlation is present in this release.
  source_ids:
    - S12
    - S35
    - S36
  state: OPEN
  resolution: Treat every oracle address as a discovery candidate; use the ABI pattern only for local mocks until the shared identity gate passes.
  reviewed_at: 2026-10-24T20:00:51Z
